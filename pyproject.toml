[project]
name = "codefest-extraccion"
version = "0.1.0"
description = "Capa de contrato y extractores del pipeline RAG (CODEFEST Ad Astra 2026, Etapa 1)"
requires-python = ">=3.11"
dependencies = [
    "langdetect>=1.0.9",
    "openpyxl>=3.1",
    "pysbd>=0.3.4,<0.4",
    "pdfplumber>=0.11,<0.12",
    "mapbox-vector-tile>=2.1,<3",
    "Pillow>=10.0,<12",
    "pillow-avif-plugin>=1.4",
    "pytesseract>=0.3.10,<0.4",
    "psutil>=5.9,<7",
    "transformers>=4.57,<5",
    "torch>=2.4,<3",
    "sentence-transformers>=5.0,<6",
    "faiss-cpu>=1.8,<2",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integracion: necesita el checkpoint del encoder descargado (1,2 GB)",
]
